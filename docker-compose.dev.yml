# Local development dependencies (Redis for distributed cache).
# Postgres: use local install or extend this file when needed.
services:
  redis:
    image: redis:7-alpine
    container_name: stockledger-redis-dev
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
