# -----------------------------------------------------------------------------
# StockLedger Retail - Frontend (Next.js 15)
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockledger-frontend
  namespace: stockledger-retail
  labels:
    app.kubernetes.io/name: stockledger-frontend
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: stockledger
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: stockledger-frontend
  template:
    metadata:
      labels:
        app: stockledger-frontend
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: frontend
          image: stockledger-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: stockledger-config
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: stockledger-frontend
  namespace: stockledger-retail
  labels:
    app.kubernetes.io/name: stockledger-frontend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
  selector:
    app: stockledger-frontend
