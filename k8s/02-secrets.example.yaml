# -----------------------------------------------------------------------------
# TEMPLATE SECRETS — Sao chép thành 02-secrets.yaml và điền giá trị thật
# KHÔNG commit 02-secrets.yaml lên git public!
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: stockledger-secrets
  namespace: stockledger-retail
type: Opaque
stringData:
  # PostgreSQL Connection String (.NET format)
  # Host=REPLACE_POSTGRES_HOST;Port=5432;Database=stockledger_retail;Username=postgres;Password=YOUR_PASSWORD;
  ConnectionStrings__Default: "Host=REPLACE_POSTGRES_HOST;Port=5432;Database=stockledger_retail;Username=postgres;Password=REPLACE_DB_PASSWORD;Include Error Detail=true;"

  # Redis Password (nếu Redis yêu cầu auth)
  Redis__Password: ""

  # JWT Secret Key (tối thiểu 32 ký tự ngẫu nhiên bảo mật)
  Auth__Jwt__SigningKey: "CHANGE_ME_PRODUCTION_SECRET_KEY_MIN_32_CHARS_ACFC_STOCKLEDGER!"

  # Bootstrap Admin Credentials
  Auth__BootstrapAdminEmail: "admin@stockledger.local"
  Auth__BootstrapAdminPassword: "REPLACE_ADMIN_PASSWORD"

  # Integration API Key (cho các hệ thống bên ngoài gọi vào)
  Integration__ApiKey: "REPLACE_WITH_STRONG_INTEGRATION_API_KEY"
